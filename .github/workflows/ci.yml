name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      # Same isolation as run_tests.ps1: a fresh SQLite database and no cloud or AI credentials
      FIR_ENV_FILE: ${{ github.workspace }}/ci-no-credentials.env
      DATABASE_URL: sqlite+aiosqlite:///${{ github.workspace }}/ci_test/fir_test.db
      SYNC_DATABASE_URL: sqlite:///${{ github.workspace }}/ci_test/fir_test.db
      EVIDENCE_DIR: ${{ github.workspace }}/ci_test/evidence
      EXPORTS_DIR: ${{ github.workspace }}/ci_test/exports
      BACKUPS_DIR: ${{ github.workspace }}/ci_test/backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Prepare the test database
        run: |
          mkdir -p ci_test/evidence ci_test/exports ci_test/backups
          python scripts/seed_demo_data.py
      - name: Run pytest
        working-directory: backend
        run: python -m pytest tests/ -q --tb=short

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
